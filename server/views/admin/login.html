<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - King Bafété</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d190f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .login-card h1 {
            text-align: center;
            color: #D4722C;
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }
        .login-card p { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 0.75rem 1rem; border: 2px solid #e5e5e5; border-radius: 8px;
            font-size: 1rem; font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #D4722C; }
        .btn {
            width: 100%; padding: 0.85rem; background: #D4722C; color: #fff; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: background 0.2s;
        }
        .btn:hover { background: #B85D1F; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>King Bafété</h1>
        <p>Panneau d'administration</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Se connecter</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error');
            errEl.style.display = 'none';
            try {
                const form = new FormData(e.target);
                const data = { email: form.get('email'), password: form.get('password') };
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(data),
                });
                const json = await res.json();
                if (json.success) {
                    window.location.href = '/admin';
                } else {
                    errEl.textContent = json.error || 'Erreur de connexion';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = 'Erreur réseau: ' + err.message;
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
