<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conte | Kingbafete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .article-header {
            background: linear-gradient(135deg, rgba(26,26,26,0.9), rgba(45,25,15,0.85));
            padding: 8rem 0 3rem;
            text-align: center;
            color: #fff;
        }
        .article-header h1 { font-size: 2.5rem; color: #fff; max-width: 800px; margin: 0 auto 1rem; }
        .article-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #444;
        }
        .article-content p { margin-bottom: 1.5rem; }
        .article-content img { max-width: 100%; border-radius: 12px; margin: 2rem 0; }
        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem;
            color: var(--color-primary); font-weight: 500; margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header class="header scrolled" id="header">
        <nav class="nav container">
            <a href="/" class="nav__logo">
                <img src="" alt="" class="logo-img" id="site-logo-img" style="display:none;height:40px;margin-right:8px;">
                <span class="logo-text" id="site-logo" style="color:var(--color-dark)">Kingbafete</span>
            </a>
            <div class="nav__menu">
                <ul class="nav__list">
                    <li class="nav__item"><a href="/" class="nav__link">Accueil</a></li>
                    <li class="nav__item"><a href="/contes" class="nav__link active">Contes</a></li>
                    <li class="nav__item"><a href="/#contact" class="nav__link nav__link--cta">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <section class="article-header">
        <div class="container">
            <h1 id="conte-title">Chargement...</h1>
        </div>
    </section>

    <main class="article-content" id="conte-content">
        <a href="/contes" class="back-link">&larr; Retour aux contes</a>
        <div id="conte-body">Chargement...</div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer__top">
                <div class="footer__brand">
                    <a href="/" class="footer__logo" id="footer-logo">Kingbafete</a>
                    <p class="footer__tagline" id="footer-motto">"Là où tu es semé, il te fleurira"</p>
                </div>
            </div>
            <div class="footer__bottom" style="padding:2rem 0;text-align:center;">
                <p class="footer__copyright">&copy; 2026 <span id="footer-site-name">Kingbafete</span>. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script>
        async function loadSettings() {
            try {
                const settings = await fetch('/api/settings').then(r => r.json());
                const logo = document.getElementById('site-logo');
                if (logo && settings.siteName) logo.textContent = settings.siteName;
                const logoImg = document.getElementById('site-logo-img');
                if (logoImg && settings.logoUrl) {
                    logoImg.src = settings.logoUrl;
                    logoImg.alt = settings.siteName || 'Logo';
                    logoImg.style.display = 'inline-block';
                }
                const footerLogo = document.getElementById('footer-logo');
                if (footerLogo && settings.siteName) footerLogo.textContent = settings.siteName;
                const footerMotto = document.getElementById('footer-motto');
                if (footerMotto && settings.motto) footerMotto.textContent = '"' + settings.motto + '"';
                const footerName = document.getElementById('footer-site-name');
                if (footerName && settings.siteName) footerName.textContent = settings.siteName;
            } catch (e) {}
        }

        async function loadConte() {
            const slug = window.location.pathname.split('/contes/')[1];
            if (!slug) return;
            try {
                const res = await fetch('/api/contes/' + slug);
                const conte = await res.json();
                document.getElementById('conte-title').textContent = conte.title;
                document.getElementById('conte-body').innerHTML = conte.content;
                document.title = conte.title + ' | Kingbafete';
            } catch (e) {
                document.getElementById('conte-body').innerHTML = '<p>Conte non trouvé.</p>';
            }
        }

        loadSettings();
        loadConte();
    </script>
</body>
</html>
